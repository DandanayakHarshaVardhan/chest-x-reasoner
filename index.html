<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chest X-Reasoner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Chest X-Reasoner</h1>
  <p class="subtitle">AI-assisted Chest X-ray Analysis</p>

  <textarea
    id="question"
    rows="3"
    placeholder="Ask a clinical question (e.g., Does the patient have a serious heart problem?)"
  ></textarea>

  <div class="upload-box">
    <input type="file" id="image" accept="image/*">
    <button onclick="analyze()">Analyze</button>
  </div>

  <div id="status" class="status">Waiting for input…</div>

  <div class="output-card">
    <h3>Reasoning Output</h3>
    <div id="out" class="output-text">No analysis yet.</div>
  </div>
</div>

<script>
async function analyze() {
  const fileInput = document.getElementById("image");
  const questionInput = document.getElementById("question");
  const status = document.getElementById("status");
  const out = document.getElementById("out");

  if (!fileInput.files.length) {
    status.innerText = "❌ Please select an image";
    return;
  }

  const form = new FormData();
  form.append("image", fileInput.files[0]);
  form.append("question", questionInput.value);

  status.innerText = "⏳ Analyzing X-ray…";
  out.innerHTML = "";

  try {
    const res = await fetch(
      "https://maye-overargumentative-uncontingently.ngrok-free.dev/analyze",
      {
        method: "POST",
        body: form
      }
    );

    const data = await res.json();

    if (data.error) {
      status.innerText = "❌ Server error";
      out.innerText = data.error;
      return;
    }

    status.innerText = "✅ Analysis complete";

    // Beautify Reasoning & Conclusion
    out.innerHTML = data.output
      .replace("Reasoning:", "<span class='label reasoning'>Reasoning</span>")
      .replace("Conclusion:", "<span class='label conclusion'>Conclusion</span>");

  } catch (err) {
    status.innerText = "❌ Network error";
    out.innerText = err.toString();
  }
}
</script>

</body>
</html>
